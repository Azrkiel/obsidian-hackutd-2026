name: CI

permissions:
  contents: read          # the tests only need to read the code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --dev
      - name: Test
        run: uv run pytest -q

  spacetime:
    name: SpacetimeDB module tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        dir: [cloud/spacetime, cloud/spacetime-cloud]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

[project]
name = "pit-pal"
version = "0.1.0"
description = "Pit Pal: AI racing coach for Assetto Corsa, powered by NVIDIA Nemotron"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "openai>=3.46.0",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
cloud = ["keyring>=25.6.0"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]


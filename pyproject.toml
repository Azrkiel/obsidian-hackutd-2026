[project]
name = "nomadsim-engine"
version = "0.1.0"
description = "NomadSim thinking engine: one-corner practice coach"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "openai>=3.46.0",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
# The coach's input receiver on the race PC: `uv run --extra pc python -m coach ...`
pc = [
    "vgamepad>=0.1.0; sys_platform == 'win32'",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]


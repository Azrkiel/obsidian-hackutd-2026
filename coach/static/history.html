<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pit Pal · Session history</title>
<link rel="icon" href="/pitpal/icon-32.png">
<style>
/* Pit Pal design system (Pit theme), same tokens and components as the coach dashboard. */
@font-face{font-family:"Pit Pal Bubble";src:url(/pitpal/fonts/PitPalBubble.woff2) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"Barlow";src:url(/pitpal/fonts/barlow-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Barlow";src:url(/pitpal/fonts/barlow-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:"Barlow";src:url(/pitpal/fonts/barlow-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Barlow";src:url(/pitpal/fonts/barlow-700-normal.woff2) format("woff2");font-weight:700}
:root{
  --bg:#12141c;--surface:#1c1f2a;--raised:#222633;--hairline:#2b2f3a;--outline-strong:#616b83;--pixel-outline:#0a0b10;
  --ink:#e8ebf2;--ink-muted:#8d96ad;--ink-faint:#5a6277;--brand:#d92b1f;--on-brand:#fff;--accent:#ff6a58;--brand-deep:#8a150f;
  --go:#3fd17a;--on-go:#06210f;--caution:#ffc233;--signal-blue:#4aa8ff;
  --font-display:"Pit Pal Bubble","Barlow",system-ui,sans-serif;--font-sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--radius-pill:999px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/24px var(--font-sans)}
img{image-rendering:pixelated;display:block}
a{color:var(--signal-blue)}
[hidden]{display:none!important}

.pp-display{font-family:var(--font-display);font-weight:400;color:#fff;text-transform:uppercase;line-height:1;--c:calc(1em/22);
  text-shadow:var(--c) 0 0 #12141c,calc(-1*var(--c)) 0 0 #12141c,0 var(--c) 0 #12141c,0 calc(-1*var(--c)) 0 #12141c,
    calc(-1*var(--c)) calc(-1*var(--c)) 0 #12141c,var(--c) calc(-1*var(--c)) 0 #12141c,calc(-1*var(--c)) var(--c) 0 #12141c,
    var(--c) var(--c) 0 var(--brand),calc(2*var(--c)) var(--c) 0 #12141c,var(--c) calc(2*var(--c)) 0 #12141c,calc(2*var(--c)) calc(2*var(--c)) 0 #12141c}
.d28{font-size:28px}.d44{font-size:44px}
.pp-label,.label{font:600 12px/16px var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.meta{display:block;font:500 14px/20px var(--font-sans);color:var(--ink-muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4) var(--space-6);padding:var(--space-3) var(--space-8) var(--space-2)}
.brand{display:flex;align-items:flex-end;gap:var(--space-3);margin-right:auto}
.brand .pp-label{padding-bottom:4px}
.brand a{text-decoration:none}
.checker{height:24px;background:url(/pitpal/pattern-checker.svg) left top/auto 24px repeat-x;image-rendering:pixelated}

/* status pill */
.status{display:inline-flex;align-items:center;gap:var(--space-2);padding:4px 12px 4px 10px;border-radius:var(--radius-pill);margin-right:auto;
  font:600 13px/18px var(--font-sans);letter-spacing:.04em;color:var(--ink);background:var(--raised);border:1px solid var(--outline-strong)}
.status::before{content:"";flex:none;width:8px;height:8px;background:var(--go)}
.status.error::before{background:var(--caution);animation:pp-blink 1000ms steps(1,end) infinite}

/* layout */
.wrap{max-width:1480px;margin:0 auto;padding:var(--space-4) var(--space-8) var(--space-8);display:flex;flex-direction:column;gap:var(--space-6)}
.toolbar{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:var(--space-6);align-items:start}
.panel{--c3:var(--outline-strong);margin:3px;padding:var(--space-4) var(--space-6);background:var(--surface);min-width:0;
  box-shadow:0 -3px 0 0 var(--c3),0 3px 0 0 var(--c3),-3px 0 0 0 var(--c3),3px 0 0 0 var(--c3)}
#notice{--c3:var(--caution);color:var(--ink)}
h2{margin:var(--space-1) 0 var(--space-3)}
#details-meta{margin:0 0 var(--space-3);color:var(--ink-muted)}
.hero{display:flex;align-items:center;gap:var(--space-4)}
.hero img{width:72px;height:72px;flex:none}

/* pixel buttons + select */
.pp-btn,button,select{--b:3px;appearance:none;border:0;cursor:pointer;margin:var(--b);padding:8px 16px;min-height:40px;
  font:700 14px/20px var(--font-sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--raised);
  box-shadow:0 calc(-1*var(--b)) 0 0 var(--outline-strong),0 var(--b) 0 0 var(--outline-strong),calc(-1*var(--b)) 0 0 0 var(--outline-strong),var(--b) 0 0 0 var(--outline-strong),inset 0 var(--b) 0 0 rgba(255,255,255,.08);
  transition:transform 90ms steps(2,end)}
button:hover:not([disabled]){transform:translateY(-2px)}
button:active:not([disabled]){transform:translateY(var(--b))}
button.primary{--b:4px;padding:12px 24px;min-height:44px;font-size:16px;color:var(--on-brand);background:var(--brand);
  box-shadow:0 calc(-1*var(--b)) 0 0 var(--pixel-outline),0 var(--b) 0 0 var(--pixel-outline),calc(-1*var(--b)) 0 0 0 var(--pixel-outline),var(--b) 0 0 0 var(--pixel-outline),
    inset 0 calc(-1*var(--b)) 0 0 var(--brand-deep),inset 0 var(--b) 0 0 rgba(255,255,255,.28),0 calc(2*var(--b)) 0 0 var(--pixel-outline)}
button[disabled]{cursor:not-allowed;transform:none;color:var(--ink-faint);background:var(--raised);box-shadow:0 -3px 0 0 var(--hairline),0 3px 0 0 var(--hairline),-3px 0 0 0 var(--hairline),3px 0 0 0 var(--hairline)}
select{text-transform:none;font-weight:600}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--ink);outline-offset:6px}

/* sessions list */
.sessions{display:grid;gap:var(--space-3);margin-top:var(--space-2)}
button.session{display:block;width:calc(100% - 6px);text-align:left;text-transform:none;letter-spacing:0;padding:var(--space-3) var(--space-4);background:var(--bg)}
button.session strong{display:block;font:700 18px/24px var(--font-sans);color:#fff;margin-bottom:2px}
button.session[aria-current=true]{background:var(--raised);box-shadow:0 -3px 0 0 var(--brand),0 3px 0 0 var(--brand),-3px 0 0 0 var(--brand),3px 0 0 0 var(--brand)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-top:var(--space-4);flex-wrap:wrap}
.empty{color:var(--ink-muted);padding:var(--space-6) 0;margin:0}

/* detail tabs + records */
.tabs{display:flex;gap:var(--space-2);margin:var(--space-2) 0 var(--space-4);flex-wrap:wrap}
.tabs button[aria-pressed=true]{color:var(--on-go);background:var(--go);box-shadow:0 -3px 0 0 var(--pixel-outline),0 3px 0 0 var(--pixel-outline),-3px 0 0 0 var(--pixel-outline),3px 0 0 0 var(--pixel-outline),inset 0 3px 0 0 rgba(255,255,255,.35)}
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--space-3)}
.record{background:var(--raised);padding:var(--space-3) var(--space-4);border-left:4px solid var(--outline-strong)}
.record h3{margin:0;font:600 12px/16px var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
.record p{margin:var(--space-1) 0;font:700 22px/28px var(--font-sans);color:#fff;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.record.ok{border-left-color:var(--go)}.record.bad{border-left-color:var(--accent)}.record.bad p{color:var(--accent)}.record.advice p{font:500 16px/22px var(--font-sans)}

@keyframes pp-blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
@media(max-width:860px){.layout{grid-template-columns:1fr}.top,.wrap{padding-left:var(--space-4);padding-right:var(--space-4)}.d44{font-size:34px}}
</style>
<script src="/history.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand"><a href="/"><span class="pp-display d44">Pit Pal</span></a><span class="pp-label">Session history</span></div>
</header>
<div class="checker" aria-hidden="true"></div>

<div class="wrap">
<div class="toolbar">
  <div id="status" class="status" role="status" aria-live="polite">Loading saved history…</div>
  <label for="source" class="pp-label">Source</label>
  <select id="source"><option value="">All sessions</option><option value="ac">Assetto Corsa</option><option value="sim">Simulator</option><option value="replay">Replay</option></select>
  <button id="refresh" class="primary">Refresh</button>
</div>
<div id="notice" class="panel" hidden></div>
<div class="layout">
  <section class="panel" aria-labelledby="sessions-title">
    <div class="pp-label">Your laps on every registered PC</div>
    <h2 id="sessions-title" class="pp-display d28">Sessions</h2>
    <div id="sessions" class="sessions"></div>
    <div class="footer"><button id="sessions-back" disabled>First page</button><button id="sessions-next" disabled>Next page</button></div>
  </section>
  <section class="panel" aria-labelledby="details-title">
    <div class="hero">
      <img src="/pitpal/mascot-helmet.png" alt="" aria-hidden="true">
      <div><div class="label">Session detail</div><h2 id="details-title" class="pp-display d28">Choose a session</h2></div>
    </div>
    <p id="details-meta">Pick a session to see its laps, corner attempts and coaching advice.</p>
    <div id="tabs" class="tabs" hidden><button data-kind="laps" aria-pressed="true">Laps</button><button data-kind="attempts" aria-pressed="false">Corner attempts</button><button data-kind="decisions" aria-pressed="false">Coaching</button></div>
    <div id="records" class="records"></div>
    <div class="footer"><span id="details-freshness" class="meta"></span><button id="records-next" hidden>More results</button></div>
  </section>
</div>
</div>
</body></html>
